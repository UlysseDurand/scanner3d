stages:
  - deploy

pages:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - mkdir -p public
    - docker run --rm -v "$(pwd):/data" ulyssedurand/readme2html:latest . . readme/figures

    - mkdir -p public/v1
    - docker run --rm -v "$(pwd):/data" ulyssedurand/readme2html:latest scanner3dV1 v1/

    - mkdir -p public/v2
    - docker run --rm -v "$(pwd):/data" ulyssedurand/readme2html:latest scanner3dV2 v2/

    - cp scanner3dV2/notebooks/main_pipeline.html public/v2nb/index.html
    - cp -r scanner3dV2/notebooks/iframe_figures public/v2nb/

  artifacts:
    paths:
      - public
