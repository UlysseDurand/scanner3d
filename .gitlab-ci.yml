stages:
  - deploy

pages:
  stage: deploy
  image: 
    name: ulyssedurand/readme2html:1.0
    pull_policy: always
  script: 
    - readme2html -s . -t . -a readme/figures -g https://gitlab.com/ulysse_durand/scanner3d

    - readme2html -s scanner3dV1 -t v1 -g https://gitlab.com/ulysse_durand/scanner3d

    - readme2html -s scanner3dV2 -t v2 -g https://gitlab.com/ulysse_durand/scanner3d

    - jupyter nbconvert scanner3dV2/notebooks/main_pipeline.ipynb --to html --output-dir=public/v2nb --TemplateExporter.extra_template_basedirs=scanner3dV2/notebooks/ --template mytemplate --no-input --execute
    - cp -r scanner3dV2/notebooks/mytemplate/static public/v2nb

  artifacts:
    paths:
      - public